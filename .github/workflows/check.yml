name: Check
on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all --check
      - run: cargo test --locked -p fgo-core -p fgo-adapters
      - run: cargo clippy --locked -p fgo-core -p fgo-adapters --all-targets -- -D warnings
      - run: cargo check --locked -p fgo-desktop
